# GitHub Pages backup: a second link for networks that block vercel.app (some providers in Turkiye).
# Published automatically on every merge to main: https://burcinoz77-droid.github.io/nasa-space-apps-2026/
# GitHub Pages cannot run server code: there is no /api/astra, so ASTRA answers in offline mode here.
name: GitHub Pages backup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /nasa-space-apps-2026/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
